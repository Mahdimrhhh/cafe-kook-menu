<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تست آپلود عکس</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f5f5f5; }
    .box { background: white; padding: 30px; border-radius: 12px; max-width: 400px; }
    input, button { margin-top: 10px; padding: 10px; width: 100%; }
    img { margin-top: 20px; max-width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>تست آپلود عکس</h2>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="uploadImage()">آپلود عکس</button>
    <div id="result"></div>
  </div>

  <script>
    async function uploadImage() {
      const fileInput = document.getElementById('imageInput');
      const file = fileInput.files[0];
      
      if (!file) {
        alert('لطفا یک عکس انتخاب کن');
        return;
      }

      const formData = new FormData();
      formData.append('image', file);

      try {
        const res = await fetch('http://localhost:5000/api/upload', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        
        document.getElementById('result').innerHTML = `
          <p style="color: green;">${data.message}</p>
          <p>آدرس عکس: ${data.imageUrl}</p>
          <img src="http://localhost:5000${data.imageUrl}" alt="uploaded">
        `;
      } catch (err) {
        document.getElementById('result').innerHTML = `<p style="color: red;">خطا در آپلود</p>`;
      }
    }
  </script>
</body>
</html>
